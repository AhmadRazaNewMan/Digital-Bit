# Publishes one markdown note under content/modules/<module>/ per run, then commits + pushes.
#
# --- Schedule (pick one) ---
# GitHub min interval = 5 minutes, AND schedules are best-effort — GitHub often DELAYS runs
# (minutes to hours), especially at :00 each hour when load is high. You will NOT get exact wall-clock every 5 min.
# Docs: https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule
#
# Offset minutes (e.g. 3-58/5) avoids firing exactly on the hour (:00) where delays pile up.
#
# TESTING ~every 5 min (best effort): cron: "3-58/5 * * * *"
# TESTING every 10 min:             cron: "7-57/10 * * * *"
# PRODUCTION daily UTC:             cron: "35 6 * * *"
#
# Need reliable timing? Trigger workflow_dispatch from an external cron (e.g. cron-job.org) + PAT.
# Note: module rotates by UTC *day*, not by run — frequent runs add new posts for that day’s module.
#
# LLM API is Groq (https://console.groq.com) — secret name GROQ_API_KEY. Not xAI "Grok" (different product/key).
#
# Author on commits (what shows in history / links to your GitHub profile):
#   Secrets: GIT_USER_NAME, GIT_USER_EMAIL  (recommended — use your verified GitHub email)
#   Or Variables: GIT_USER_NAME, GIT_USER_EMAIL  (Settings → Secrets and variables → Actions → Variables)
#   Fallback below only if both are unset.
#
# GitHub: Settings → Actions → General → Workflow permissions → Read and write.

name: Daily content

on:
  schedule:
    - cron: "3-58/5 * * * *" # ~every 5 min UTC, offset from :00 (still subject to GitHub delays)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run context (why schedules behave oddly)
        run: |
          echo "trigger=${{ github.event_name }}"
          echo "GitHub scheduled workflows: minimum interval = 5 minutes (official docs)."
          echo "Use Actions tab → Daily content → Run workflow for an immediate test run."

      - name: Groq secret sanity check (length only, value hidden)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          k = (os.environ.get("GROQ_API_KEY") or "").strip()
          print(f"GROQ_API_KEY non-whitespace length: {len(k)}")
          if len(k) < 30:
              print("::warning::Key looks missing or too short — repo Settings → Secrets → Actions → GROQ_API_KEY (Groq Cloud, not xAI Grok).")
          PY

      - name: Configure Git author (your name + email on every commit)
        run: |
          NAME="${{ secrets.GIT_USER_NAME }}"
          EMAIL="${{ secrets.GIT_USER_EMAIL }}"
          [ -z "$NAME" ] && NAME="${{ vars.GIT_USER_NAME }}"
          [ -z "$EMAIL" ] && EMAIL="${{ vars.GIT_USER_EMAIL }}"
          [ -z "$NAME" ] && NAME="AhmadRazaNewMan"
          [ -z "$EMAIL" ] && EMAIL="webdevolopmentbyar@gmail.com"
          git config user.name "$NAME"
          git config user.email "$EMAIL"
          echo "Using commit identity: $(git config user.name) <$(git config user.email)>"

      - name: Generate post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "::warning::GROQ_API_KEY secret is empty — posts will be placeholders until you add it (Settings → Secrets and variables → Actions)."
          else
            echo "GROQ_API_KEY is set; calling Groq from the runner…"
          fi
          python3 scripts/daily_post.py > /tmp/rel_path.txt 2>/tmp/gen-stderr.log
          if [ -s /tmp/gen-stderr.log ]; then echo "--- daily_post.py stderr ---"; cat /tmp/gen-stderr.log; echo "---"; fi
          REL="$(tr -d '\r' < /tmp/rel_path.txt | head -1)"
          echo "REL_PATH=$REL" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git add "$REL_PATH"
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          export GIT_AUTHOR_NAME="$(git config user.name)"
          export GIT_AUTHOR_EMAIL="$(git config user.email)"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git commit -m "daily: add ${REL_PATH}"
          git push
